<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canım Anneme ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* GİRİŞ EKRANI */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ff4d6d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: 1s ease-in-out;
        }

        #overlay h2 { color: white; margin-bottom: 20px; font-family: 'Great Vibes', cursive; font-size: 40px; text-align: center; padding: 0 20px; }

        .start-btn {
            padding: 20px 50px;
            font-size: 24px;
            background: white;
            color: #ff4d6d;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-weight: bold;
            transition: 0.3s;
        }

        .start-btn:hover { transform: scale(1.1); }

        /* KÜÇÜK İMZA */
        .credit {
            position: absolute;
            top: 15px; right: 15px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 11px;
            background: rgba(0, 0, 0, 0.1);
            padding: 6px 12px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        /* KART TASARIMI */
        .card {
            width: 90%; max-width: 550px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            z-index: 2;
            opacity: 0;
            transform: scale(0.9);
            transition: 1s ease-out;
        }

        .card.visible { opacity: 1; transform: scale(1); }

        h1 { font-family: 'Great Vibes', cursive; font-size: 50px; color: #ff2f68; }

        .photo img {
            width: 160px; height: 160px;
            object-fit: cover; border-radius: 50%;
            border: 5px solid white; margin: 20px 0;
        }

        #message {
            margin-top: 20px; font-size: 26px; color: #ff2f68; font-weight: 700;
            display: none; animation: popIn 0.8s forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .heart { position: absolute; color: #ff4d6d; animation: float linear infinite; z-index: 1; pointer-events: none; }
        @keyframes float {
            0% { transform: translateY(110vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>Annem İçin Bir Sürpriz...</h2>
        <button class="start-btn" onclick="startExperience()">Buraya Tıkla Anneciğim ❤️</button>
    </div>

    <div class="credit">
        Tasarlayan: <b>Ömer Ege Kırık</b> | Annesi: Tuğba Kırık
    </div>

    <div class="card" id="mainCard">
        <h1>Anneler Günün Kutlu Olsun</h1>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=800" alt="Annem">
        </div>
        <p style="color: #444; font-size: 18px;">Senin sevgin dünyadaki en büyük hazine.</p>
        
        <div id="message">Seni Çok Seviyorum! 💖</div>
    </div>

    <script>
        function startExperience() {
            // Perdeyi kaldır
            document.getElementById("overlay").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("overlay").style.display = "none";
                document.getElementById("mainCard").classList.add("visible");
            }, 1000);

            // Mesajı ve kalpleri göster
            setTimeout(() => {
                document.getElementById("message").style.display = "block";
                createHearts();
            }, 1200);
        }

        function createHearts() {
            setInterval(() => {
                let heart = document.createElement("div");
                heart.innerHTML = ["❤️","💖","🌸","✨"][Math.floor(Math.random()*4)];
                heart.classList.add("heart");
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.fontSize = (15 + Math.random() * 25) + "px";
                heart.style.animationDuration = (3 + Math.random() * 5) + "s";
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 6000);
            }, 300);
        }
    </script>
</body>
</html>
